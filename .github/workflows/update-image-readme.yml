name: Update Image Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 1 UTC everyday
    - cron: "0 1 * * *"

jobs:
  update-readme:
    name: Update Image README
    runs-on: ubuntu-latest
    steps:
      - uses: debasishray16/debasishray16@main
        with:
          HEIGHT: 180px       # default
          WIDTH: 180px        # default
          ALIGN: right        # default
          IMG_ALT: Image ALT #image alt to be displayed if image is not mapped correctly

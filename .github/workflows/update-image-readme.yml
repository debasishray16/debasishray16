name: Update Image Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 12 AM UTC everyday
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update Image README
    runs-on: ubuntu-latest
    steps:
      - uses: siddharth2016/update-readme-image@0.1.1
        with:
          HEIGHT: 85%       # default
          WIDTH: 85%        # default
          ALIGN: center        # default
          IMG_ALT: image_generator #image alt to be displayed if image is not mapped correctly
